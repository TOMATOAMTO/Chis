# ============================================
# Chis - Mono-repo CI/CD Pipeline
# ============================================
name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# 允许取消正在进行的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # 路径检测 Job
  # ============================================
  detect-changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      harmony: ${{ steps.filter.outputs.harmony }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
            harmony:
              - 'harmony/**'

  # ============================================
  # Android 构建 Job
  # ============================================
  android-build:
    name: 🤖 Android Build & Test
    needs: detect-changes
    if: needs.detect-changes.outputs.android == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Verify gradle-wrapper.jar exists
        working-directory: ./android
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "❌ gradle-wrapper.jar not found!"
            exit 1
          fi
          echo "✅ gradle-wrapper.jar found"
          ls -la gradle/wrapper/

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Run Unit Tests
        working-directory: ./android
        run: ./gradlew test --no-daemon

      - name: Run Lint
        working-directory: ./android
        run: ./gradlew lint --no-daemon
        continue-on-error: true

      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: android/app/build/reports/tests/
          retention-days: 7

  # ============================================
  # HarmonyOS 构建 Job
  # ============================================
  harmony-build:
    name: 🔮 HarmonyOS Build & Test
    needs: detect-changes
    if: needs.detect-changes.outputs.harmony == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install OHPM CLI
        run: |
          # 下载 OHPM 命令行工具
          wget -q https://repo.huaweicloud.com/openharmony/os/4.1-Release/ohpm-4.1.0.7-linux-x64.tar.gz
          tar -xzf ohpm-4.1.0.7-linux-x64.tar.gz
          echo "$(pwd)/ohpm/bin" >> $GITHUB_PATH

      - name: Cache OHPM packages
        uses: actions/cache@v4
        with:
          path: |
            harmony/oh_modules
            ~/.ohpm
          key: ${{ runner.os }}-ohpm-${{ hashFiles('harmony/oh-package.json5') }}
          restore-keys: |
            ${{ runner.os }}-ohpm-

      - name: Install HarmonyOS dependencies
        working-directory: ./harmony
        run: |
          ohpm install
        continue-on-error: true

      - name: Verify HarmonyOS project structure
        working-directory: ./harmony
        run: |
          echo "📁 HarmonyOS project files:"
          ls -la
          echo ""
          echo "📁 Entry module:"
          ls -la entry/

      - name: Run HarmonyOS lint check
        working-directory: ./harmony
        run: |
          # 使用 hvigor 进行代码检查（如果可用）
          npx hvigorw --mode module -p module=entry@default -p product=default assembleHap --no-daemon
        continue-on-error: true

      - name: Upload HarmonyOS Build Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: harmony-build
          path: |
            harmony/build/outputs/
            harmony/entry/build/outputs/
          retention-days: 7

  # ============================================
  # 代码质量检查 Job
  # ============================================
  code-quality:
    name: 📊 Code Quality
    needs: [ android-build, harmony-build ]
    if: always() && (needs.android-build.result == 'success' || needs.harmony-build.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run CodeQL Analysis (Android)
        uses: github/codeql-action/init@v3
        with:
          languages: kotlin
          queries: +security-and-quality
        if: needs.android-build.result == 'success'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        if: needs.android-build.result == 'success'

  # ============================================
  # 构建摘要 Job
  # ============================================
  build-summary:
    name: 📋 Build Summary
    needs: [ detect-changes, android-build, harmony-build, code-quality ]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate Summary
        run: |
          echo "## 🚀 CI Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Changed Paths" >> $GITHUB_STEP_SUMMARY
          echo "- Android: ${{ needs.detect-changes.outputs.android }}" >> $GITHUB_STEP_SUMMARY
          echo "- HarmonyOS: ${{ needs.detect-changes.outputs.harmony }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Android | ${{ needs.android-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| HarmonyOS | ${{ needs.harmony-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 Code Quality" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY

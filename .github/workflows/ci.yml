# ============================================
# Chis - Mono-repo CI/CD Pipeline
# ============================================
name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # 路径检测
  # ============================================
  detect-changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      harmony: ${{ steps.filter.outputs.harmony }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
            harmony:
              - 'harmony/**'

  # ============================================
  # Android 构建
  # ============================================
  android-build:
    name: 🤖 Android Build
    needs: detect-changes
    if: needs.detect-changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Verify gradle-wrapper.jar exists
        working-directory: ./android
        run: |
          echo "📁 Gradle wrapper files:"
          ls -la gradle/wrapper/
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "❌ gradle-wrapper.jar not found!"
            exit 1
          fi
          echo "✅ gradle-wrapper.jar verified"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Run Unit Tests
        working-directory: ./android
        run: ./gradlew test --no-daemon
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # ============================================
  # HarmonyOS 验证
  # ============================================
  harmony-build:
    name: 🔮 HarmonyOS Validate
    needs: detect-changes
    if: needs.detect-changes.outputs.harmony == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify HarmonyOS project structure
        working-directory: ./harmony
        run: |
          echo "📁 HarmonyOS 项目结构检查"
          echo "========================="
          echo ""
          echo "根目录文件:"
          ls -la
          echo ""
          echo "检查必要配置文件..."
          
          # 检查必要的配置文件
          required_files=(
            "build-profile.json5"
            "oh-package.json5"
            "entry/module.json5"
          )
          
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file"
            else
              echo "❌ $file 缺失!"
              missing=true
            fi
          done
          
          echo ""
          echo "检查源代码文件..."
          find entry/src -name "*.ets" | head -10
          echo ""
          
          if [ "$missing" = true ]; then
            echo "❌ 项目结构验证失败"
            exit 1
          fi
          
          echo "✅ HarmonyOS 项目结构验证通过"

      - name: Generate build report
        if: always()
        run: |
          echo "## 📋 HarmonyOS 构建报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 验证结果" >> $GITHUB_STEP_SUMMARY
          echo "✅ 项目结构完整" >> $GITHUB_STEP_SUMMARY
          echo "✅ 源代码存在" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💡 构建说明" >> $GITHUB_STEP_SUMMARY
          echo "HarmonyOS HAP 包需要使用 DevEco Studio 或本地 OHPM 工具构建。" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # 构建摘要
  # ============================================
  build-summary:
    name: 📋 Build Summary
    needs: [ detect-changes, android-build, harmony-build ]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate Summary
        run: |
          echo "## 🚀 CI Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Android | ${{ needs.android-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| HarmonyOS | ${{ needs.harmony-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Notes" >> $GITHUB_STEP_SUMMARY
          echo "- Android: 完整的构建和测试流程" >> $GITHUB_STEP_SUMMARY
          echo "- HarmonyOS: 项目结构验证（HAP包需本地构建）" >> $GITHUB_STEP_SUMMARY
